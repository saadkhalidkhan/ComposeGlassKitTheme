name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add GlassCard over ...
        2. Set blurRadius to ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: api
    attributes:
      label: Android API level
      placeholder: "34"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / emulator
      placeholder: Pixel 6 API 34
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste Logcat snippets or link images from docs/media if helpful.
