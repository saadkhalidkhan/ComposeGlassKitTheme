name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run library unit tests
        run: ./gradlew :glasskit:test --no-daemon --stacktrace

      - name: Assemble library (release)
        run: ./gradlew :glasskit:assembleRelease --no-daemon --stacktrace

      - name: Assemble sample app (debug)
        run: ./gradlew :sample:assembleDebug --no-daemon --stacktrace
