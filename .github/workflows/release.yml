name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          ./gradlew :glasskit:test :glasskit:assembleRelease :sample:assembleDebug --no-daemon --stacktrace

      - name: Upload sample APK
        uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload library AAR
        uses: actions/upload-artifact@v4
        with:
          name: glasskit-release-aar
          path: glasskit/build/outputs/aar/*.aar
          if-no-files-found: error
